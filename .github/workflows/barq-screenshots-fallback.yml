name: BARQ Screenshot Fallback API 30

on:
  workflow_dispatch:
  push:
    branches: ["barq/**"]
    paths:
      - ".github/workflows/barq-screenshots-fallback.yml"

permissions:
  contents: read

concurrency:
  group: barq-screenshots-fallback-api30
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get
      - name: Boot lightweight Android emulator and capture BARQ
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euxo pipefail
            cd android
            mkdir -p ../artifacts
            echo "=== DEVICE ==="
            adb devices -l
            adb shell getprop sys.boot_completed
            echo "=== CAPTURE START ==="
            flutter test integration_test/barq_screenshots_test.dart -d emulator-5554 --reporter expanded
            cd ..
            find artifacts/barq-ui-screenshots -maxdepth 1 -type f -name '*.png' -printf '%f %s bytes\\n' | sort
            count="$(find artifacts/barq-ui-screenshots -type f -iname '*.png' | wc -l)"
            echo "PNG_COUNT=$count"
            test "$count" -eq 11
            zip -qr artifacts/barq-ui-screenshots-api30.zip artifacts/barq-ui-screenshots
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-ui-screenshots-api30-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
