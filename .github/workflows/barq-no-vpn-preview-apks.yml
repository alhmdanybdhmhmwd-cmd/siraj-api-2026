name: BARQ and Admin preview APKs (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barq-no-vpn-preview-apks
  cancel-in-progress: false

jobs:
  build-barq:
    name: Build BARQ Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq/no-vpn-routing-2026-11-25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Resolve BARQ packages
        working-directory: android
        run: flutter pub get
      - name: Analyze BARQ
        working-directory: android
        run: flutter analyze --no-pub
      - name: Test BARQ
        working-directory: android
        run: flutter test --no-pub
      - name: Build ARM64 debug APK
        working-directory: android
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=BARQ_API_BASE=https://siraj-api-2026.vercel.app
      - name: Report APK size
        run: |
          test -s android/build/app/outputs/flutter-apk/app-debug.apk
          stat -c 'BARQ APK size: %s bytes' android/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: barq-no-vpn-arm64-debug
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-admin:
    name: Build BARQ Admin Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq/no-vpn-routing-2026-11-25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Resolve Admin packages
        working-directory: admin/mobile
        run: flutter pub get
      - name: Analyze Admin
        working-directory: admin/mobile
        run: flutter analyze --no-pub
      - name: Test Admin
        working-directory: admin/mobile
        run: flutter test --no-pub
      - name: Build ARM64 debug APK
        working-directory: admin/mobile
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=BARQ_API_BASE=https://siraj-api-2026.vercel.app
      - name: Report APK size
        run: |
          test -s admin/mobile/build/app/outputs/flutter-apk/app-debug.apk
          stat -c 'BARQ Admin APK size: %s bytes' admin/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: barq-admin-no-vpn-arm64-debug
          path: admin/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
