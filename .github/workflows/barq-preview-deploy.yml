name: BARQ isolated Preview Worker deploy

on:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: "Explicitly approve deploying the isolated BARQ Preview Worker (never production)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-preview:
    if: inputs.deploy_preview == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
      BARQ_PREVIEW_JWT_SECRET: ${{ secrets.BARQ_PREVIEW_JWT_SECRET }}
      BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID: ${{ secrets.BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID }}
      BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated Preview target and required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BARQ_PREVIEW_JWT_SECRET"
          test -n "$BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID"
          test -n "$BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          test = tomllib.loads(Path("wrangler.test.toml").read_text())
          prod = tomllib.loads(Path("wrangler.toml").read_text())
          assert test["name"] == "barq-api-phase2-test"
          assert test["d1_databases"][0]["database_name"] == "barq-phase2-test-2026-11-20"
          assert test["d1_databases"][0]["database_id"] == "5bfada32-4f9b-4edb-85dd-3b3b30ab73b0"
          assert test["d1_databases"][0]["database_id"] != prod["d1_databases"][0]["database_id"]
          assert test["d1_databases"][0]["database_id"] != "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0"
          assert "routes" not in test
          assert "workers_dev" in test and test["workers_dev"] is True
          assert test["name"] != prod["name"]
          print("Preview target guard passed: dedicated Worker + isolated D1, no production routes.")
          PY
          npx --yes wrangler@4 whoami
      - name: Deploy isolated Preview Worker
        run: npx --yes wrangler@4 deploy --config wrangler.test.toml
      - name: Install Preview-only secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BARQ_PREVIEW_JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET --config wrangler.test.toml
          printf '%s' "$BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID" | npx --yes wrangler@4 secret put TIGRIS_ACCESS_KEY_ID --config wrangler.test.toml
          printf '%s' "$BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY" | npx --yes wrangler@4 secret put TIGRIS_SECRET_ACCESS_KEY --config wrangler.test.toml
      - name: Verify deployed Preview health endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="https://barq-api-phase2-test.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          curl --connect-timeout 5 --max-time 15 --silent --show-error --fail "$URL/health/live" > live.json
          curl --connect-timeout 5 --max-time 15 --silent --show-error --fail "$URL/health/ready" > ready.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const live = JSON.parse(fs.readFileSync('live.json', 'utf8'));
          const ready = JSON.parse(fs.readFileSync('ready.json', 'utf8'));
          if (live.status !== 'alive' || live.service !== 'barq-api') throw new Error('Preview liveness verification failed');
          if (ready.status !== 'ready' || ready.service !== 'barq-api') throw new Error('Preview D1 readiness verification failed');
          console.log('Isolated Preview Worker is live and its test D1 is ready.');
          NODE
          echo "Preview Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"
