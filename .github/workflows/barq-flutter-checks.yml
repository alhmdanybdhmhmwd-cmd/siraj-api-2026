name: BARQ Flutter analysis and tests (no APK build)

on:
  push:
    branches:
      - barq/phase4-messaging-interactions-2026-11-22
      - barq/phase5-feature-audit-2026-11-22
    paths:
      - "android/**"
      - ".github/workflows/barq-flutter-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version
      - name: Resolve Android dependencies
        working-directory: android
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: android
        run: flutter analyze --no-pub
      - name: Run Flutter tests (no build)
        working-directory: android
        run: flutter test --no-pub
