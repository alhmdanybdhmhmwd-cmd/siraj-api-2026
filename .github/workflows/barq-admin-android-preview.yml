name: BARQ Admin Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barq-admin-android-preview
  cancel-in-progress: false

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected Admin source revision
        uses: actions/checkout@v4
        with:
          # workflow_dispatch runs against the branch selected in GitHub Actions.
          # Keep the source and workflow on the same immutable revision.
          ref: ${{ github.sha }}

      - name: Require the public Google OAuth client ID
        shell: bash
        env:
          BARQ_GOOGLE_OIDC_CLIENT_ID: ${{ vars.BARQ_GOOGLE_OIDC_CLIENT_ID }}
        run: |
          if [[ ! "$BARQ_GOOGLE_OIDC_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::Set the GitHub Actions repository variable BARQ_GOOGLE_OIDC_CLIENT_ID to the native Android OAuth client ID before building."
            exit 1
          fi
          echo "Google OAuth client ID format verified (value intentionally not printed)."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: admin/mobile
        run: flutter pub get

      - name: Analyze Admin app
        working-directory: admin/mobile
        run: flutter analyze

      - name: Run Admin app tests
        working-directory: admin/mobile
        run: flutter test

      - name: Build compact internal ARM64 release APK
        working-directory: admin/mobile
        env:
          BARQ_GOOGLE_OIDC_CLIENT_ID: ${{ vars.BARQ_GOOGLE_OIDC_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --dart-define=BARQ_GOOGLE_OIDC_CLIENT_ID="$BARQ_GOOGLE_OIDC_CLIENT_ID"

      - name: Verify APK and report size and checksum
        id: apk
        shell: bash
        run: |
          APK="admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          echo "size_bytes=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK size: $APK_SIZE bytes"
          echo "APK SHA-256: $APK_SHA256"

      - name: Upload BARQ Admin S7 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: barq-admin-s7-arm64-internal
          path: admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
