name: BARQ Admin Android Preview APK

on:
  push:
    branches:
      - "barq-admin-s7-optimized-2026-11-24"
    paths:
      - "admin/mobile/**"
      - ".github/workflows/barq-admin-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barq-admin-android-preview
  cancel-in-progress: false

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Admin source
        uses: actions/checkout@v4
        with:
          ref: barq-admin-s7-optimized-2026-11-24

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: admin/mobile
        run: flutter pub get

      - name: Format, analyze, and test
        working-directory: admin/mobile
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Build optimized ARM64 release-mode preview APK for Galaxy S7
        working-directory: admin/mobile
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify APK exists and report size
        id: apk
        shell: bash
        run: |
          APK="admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          echo "size_bytes=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "APK size: $APK_SIZE bytes"
          sha256sum "$APK"

      - name: Upload BARQ Admin Galaxy S7 optimized APK and symbols
        uses: actions/upload-artifact@v4
        with:
          name: barq-admin-galaxy-s7-arm64-optimized
          path: |
            admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            admin/mobile/build/symbols/
          if-no-files-found: error
          retention-days: 14
