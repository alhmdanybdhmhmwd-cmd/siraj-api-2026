name: BARQ Admin Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barq-admin-android-preview
  cancel-in-progress: false

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected Admin source revision
        uses: actions/checkout@v4
        with:
          # workflow_dispatch runs against the branch selected in GitHub Actions.
          # Keep the source and workflow on the same immutable revision.
          ref: ${{ github.sha }}

      - name: Check stable release signing configuration
        id: signing
        shell: bash
        env:
          BARQ_ADMIN_KEYSTORE_BASE64: ${{ secrets.BARQ_ADMIN_KEYSTORE_BASE64 }}
          BARQ_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.BARQ_ADMIN_KEYSTORE_PASSWORD }}
          BARQ_ADMIN_KEY_ALIAS: ${{ secrets.BARQ_ADMIN_KEY_ALIAS }}
          BARQ_ADMIN_KEY_PASSWORD: ${{ secrets.BARQ_ADMIN_KEY_PASSWORD }}
        run: |
          if [[ -n "$BARQ_ADMIN_KEYSTORE_BASE64" && -n "$BARQ_ADMIN_KEYSTORE_PASSWORD" && -n "$BARQ_ADMIN_KEY_ALIAS" && -n "$BARQ_ADMIN_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: admin/mobile
        run: flutter pub get

      - name: Analyze Admin app
        working-directory: admin/mobile
        run: flutter analyze

      - name: Run Admin app tests
        working-directory: admin/mobile
        run: flutter test

      - name: Prepare stable BARQ Admin signing key
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          BARQ_ADMIN_KEYSTORE_BASE64: ${{ secrets.BARQ_ADMIN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$BARQ_ADMIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/barq-admin-release.jks"
          test -s "$RUNNER_TEMP/barq-admin-release.jks"

      - name: Build compact internal ARM64 release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        working-directory: admin/mobile
        env:
          BARQ_ADMIN_KEYSTORE_PATH: ${{ runner.temp }}/barq-admin-release.jks
          BARQ_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.BARQ_ADMIN_KEYSTORE_PASSWORD }}
          BARQ_ADMIN_KEY_ALIAS: ${{ secrets.BARQ_ADMIN_KEY_ALIAS }}
          BARQ_ADMIN_KEY_PASSWORD: ${{ secrets.BARQ_ADMIN_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Verify APK and report size and checksum
        if: ${{ steps.signing.outputs.configured == 'true' }}
        id: apk
        shell: bash
        run: |
          APK="admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          echo "size_bytes=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK size: $APK_SIZE bytes"
          echo "APK SHA-256: $APK_SHA256"

      - name: Upload BARQ Admin S7 ARM64 APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: barq-admin-s7-arm64-internal
          path: admin/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report APK build skipped until stable signing is configured
        if: ${{ steps.signing.outputs.configured != 'true' }}
        shell: bash
        run: echo "::warning::APK packaging skipped: stable BARQ Admin signing secrets are not configured."
