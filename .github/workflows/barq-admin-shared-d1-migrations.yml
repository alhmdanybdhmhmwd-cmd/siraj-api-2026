name: BARQ Admin shared D1 migrations

on:
  push:
    branches:
      - barq/no-vpn-routing-rebased-2026-11-26
    paths:
      - ".github/workflows/barq-admin-shared-d1-migrations.yml"
      - "admin/migrations/**"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Set true only after explicit approval to write the reviewed Admin schema to siraj-db"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: barq-admin-shared-d1-migrations
  cancel-in-progress: false

jobs:
  apply-admin-only-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: barq-admin-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact shared D1 and existing Worker before any write
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::BARQ_CLOUDFLARE_API_TOKEN is missing from repository Actions secrets or barq-admin-preview."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::BARQ_CLOUDFLARE_ACCOUNT_ID is missing from repository Actions variables or barq-admin-preview."; exit 1; }
          python3 - <<'PY'
          import re
          from pathlib import Path
          config = Path("wrangler.toml").read_text()
          name = re.search(r'database_name\s*=\s*"([^"]+)"', config)
          ident = re.search(r'database_id\s*=\s*"([^"]+)"', config)
          if not name or name.group(1) != "siraj-db":
              raise SystemExit("Refusing: root Worker config does not target siraj-db.")
          if not ident or ident.group(1) != "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0":
              raise SystemExit("Refusing: shared D1 ID differs from the reviewed BARQ database.")
          PY
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/d1/database?per_page=100" > /tmp/barq-d1.json
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts" > /tmp/barq-workers.json
          python3 - <<'PY'
          import json
          d1 = json.load(open("/tmp/barq-d1.json"))
          workers = json.load(open("/tmp/barq-workers.json"))
          if not d1.get("success") or not workers.get("success"):
              raise SystemExit("Cloudflare read-only identity preflight failed.")
          matches = [x for x in d1.get("result", []) if x.get("uuid") == "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0" and x.get("name") == "siraj-db"]
          scripts = workers.get("result", [])
          if len(matches) != 1:
              raise SystemExit("Refusing: exact siraj-db UUID/name pair not visible to this account.")
          if not any(x.get("id") == "siraj-api" or x.get("script_name") == "siraj-api" for x in scripts):
              raise SystemExit("Refusing: existing siraj-api Worker not visible to this account.")
          print("Verified exact existing siraj-db and siraj-api. No write has occurred yet.")
          PY

      - name: Enforce additive Admin-only SQL allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          files = sorted(Path("admin/migrations").glob("*.sql"))
          if len(files) != 7:
              raise SystemExit(f"Expected 7 reviewed Admin migrations, found {len(files)}.")

          db = sqlite3.connect(":memory:")
          trigger_pattern = re.compile(
              r"CREATE TRIGGER IF NOT EXISTS (admin_audit_no_update|admin_audit_no_delete) "
              r"BEFORE (UPDATE|DELETE) ON admin_audit_events\s+"
              r"BEGIN\s+SELECT RAISE\(ABORT, 'admin audit events are immutable'\);\s+END\s*;",
              re.I | re.S,
          )

          for path in files:
              sql = re.sub(r"--[^\n]*", "", path.read_text()).strip()
              triggers = trigger_pattern.findall(sql)
              sql_without_triggers = trigger_pattern.sub("", sql)
              if re.search(r"CREATE\s+TRIGGER", sql_without_triggers, re.I):
                  raise SystemExit(f"Unreviewed trigger definition in {path.name}.")
              statements = [s.strip() for s in sql_without_triggers.split(";") if s.strip()]
              for statement in statements:
                  if not re.match(
                      r"^(CREATE TABLE IF NOT EXISTS|CREATE INDEX IF NOT EXISTS|PRAGMA foreign_keys\s*=\s*ON)\b",
                      statement, re.I
                  ):
                      raise SystemExit(
                          f"Refusing non-additive or unreviewed SQL in {path.name}: {statement[:80]!r}"
                      )
                  # The top-level allowlist above rejects DML/DDL mutations.
                  # Do not scan nested CREATE TABLE clauses for DELETE: ON DELETE
                  # CASCADE/SET NULL are legitimate foreign-key actions.
              try:
                  db.executescript(sql)
              except sqlite3.Error as exc:
                  raise SystemExit(f"SQLite schema validation failed for {path.name}: {exc}")

          objects = db.execute(
              "SELECT name FROM sqlite_master WHERE type IN ('table','index','trigger') "
              "AND name NOT LIKE 'sqlite_%'"
          ).fetchall()
          if any(not name.startswith("admin_") and not name.startswith("idx_admin_") for (name,) in objects):
              raise SystemExit("Migration created an object outside the BARQ Admin namespace.")
          print("All seven Admin migrations passed additive SQL policy and SQLite in-memory schema validation.")
          PY
          if [[ "${{ inputs.apply_migrations }}" != "true" ]]; then
            echo "Dry run only: no D1 migration writes were requested."
          fi

      - name: Apply idempotent Admin schema to the verified shared BARQ D1
        if: ${{ inputs.apply_migrations == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/migrations/*.sql; do
            if grep -Eiq '^[[:space:]]*(CREATE|PRAGMA)' "$file"; then
              echo "Applying reviewed Admin schema file: $file"
              npx --yes wrangler@4 d1 execute siraj-db --remote --config wrangler.toml --file "$file"
            else
              echo "No SQL statements to apply in $file"
            fi
          done

      - name: Verify required Admin tables exist without reading user data
        if: ${{ inputs.apply_migrations == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for table in admin_workspaces admin_tasks admin_task_checkpoints admin_approvals admin_audit_events admin_project_knowledge admin_ai_usage_limits admin_image_generation_limits admin_owner_devices admin_owner_sessions admin_oidc_nonce_uses admin_auth_rate_limits admin_owner_refresh_token_history admin_brain_conversations admin_brain_messages; do
            npx --yes wrangler@4 d1 execute siraj-db --remote --config wrangler.toml --command "SELECT * FROM $table LIMIT 0;"
          done
          echo "All expected BARQ Admin tables are queryable; no BARQ user rows were read."
