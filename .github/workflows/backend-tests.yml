name: Backend tests

on:
  push:
    branches:
      - main
      - "barq/**"
  pull_request:

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/src/index.js
      - name: Check transformed Worker test module syntax
        run: |
          node test/prepare_worker_test_module.mjs
          node --check /tmp/barq-worker-auth-transformed.mjs
      - name: Run backend authentication tests
        run: npm test
      - name: Test D1 migration SQL with SQLite
        run: python3 test/migrations.test.py
      - name: Test D1 schema inspection queries with SQLite
        run: python3 test/d1_schema_inspection.test.py
      - name: Verify test Wrangler config cannot target production
        run: python3 test/barq_wrangler_config.test.py
      - name: Verify Android Firebase package and signing-key safety
        run: python3 test/android_release_safety.test.py
