name: Backend tests

on:
  push:
    branches:
      - main
      - "barq/**"
  pull_request:

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Check Worker JavaScript syntax
        run: node --check src/src/index.js
      - name: Check standalone Node API syntax
        run: node --check node_server.mjs
      - name: Check Vercel and legacy proxy syntax
        run: |
          node --check "api/[...path].js"
          node --check server.js
      - name: Audit Worker runtime portability dependencies
        run: npm run audit:runtime-portability
      - name: Run backend authentication tests
        run: npm test
      - name: Test D1 migration SQL with SQLite
        run: python3 test/migrations.test.py
      - name: Test production group compatibility against existing D1 schema
        run: python3 test/production_groups_compat.test.py
      - name: Test per-user private conversation clearing and deletion
        run: python3 test/private_conversation_visibility.test.py
      - name: Test D1 schema inspection queries with SQLite
        run: python3 test/d1_schema_inspection.test.py
      - name: Verify test Wrangler config cannot target production
        run: python3 test/barq_wrangler_config.test.py
      - name: Verify Android Firebase package and signing-key safety
        run: python3 test/android_release_safety.test.py
