name: Worker checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply D1 migrations to an isolated local database
        run: npx wrangler d1 migrations apply siraj-db --local
      - run: npm test
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run
