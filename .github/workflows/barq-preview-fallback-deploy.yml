name: BARQ isolated Preview fallback Worker deploy

on:
  # Auto-run only on the dedicated Phase 8 branch so Preview verification
  # can follow approved fixes without requiring repeated manual dispatch.
  push:
    branches:
      - barq/phase8-cleanup-preview-readiness-2026-11-23
      - barq/repair-batch-2026-11-23
      - barq/ux-media-chat-spark-2026-11-23
    paths:
      - "src/**"
      - "api/**"
      - "android/**"
      - "test/**"
      - "wrangler.fallback.test.toml"
      - ".github/workflows/barq-preview-fallback-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_preview_fallback:
        description: "Explicitly approve deploying the isolated fallback Worker (Preview only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy-preview-fallback:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/barq/phase8-cleanup-preview-readiness-2026-11-23' || github.ref == 'refs/heads/barq/repair-batch-2026-11-23' || github.ref == 'refs/heads/barq/ux-media-chat-spark-2026-11-23')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_preview_fallback == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
      BARQ_PREVIEW_JWT_SECRET: ${{ secrets.BARQ_PREVIEW_JWT_SECRET }}
      BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID: ${{ secrets.BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID }}
      BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify fallback isolation and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BARQ_PREVIEW_JWT_SECRET"
          test -n "$BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID"
          test -n "$BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          fallback = tomllib.loads(Path("wrangler.fallback.test.toml").read_text())
          preview = tomllib.loads(Path("wrangler.test.toml").read_text())
          production = tomllib.loads(Path("wrangler.toml").read_text())
          assert fallback["name"] == "barq-api-phase2-fallback-test"
          assert fallback["workers_dev"] is True
          assert "routes" not in fallback
          assert "triggers" not in fallback
          assert fallback["d1_databases"][0]["database_id"] == "5bfada32-4f9b-4edb-85dd-3b3b30ab73b0"
          assert fallback["d1_databases"][0]["database_id"] == preview["d1_databases"][0]["database_id"]
          assert fallback["d1_databases"][0]["database_id"] != production["d1_databases"][0]["database_id"]
          assert fallback["vars"]["TIGRIS_BUCKET"] == "barq-preview-media"
          assert fallback["vars"]["TIGRIS_BUCKET"] != production["vars"]["TIGRIS_BUCKET"]
          assert fallback["name"] != preview["name"] and fallback["name"] != production["name"]
          print("Fallback guard passed: distinct Preview Worker; shared isolated Preview D1/media only; no production route, database, bucket, or cron.")
          PY
          npx --yes wrangler@4 whoami
      - name: Verify Cloudflare workers.dev account subdomain
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --connect-timeout 10 --max-time 20 --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          echo "$RESPONSE" | jq '{success, errors, result}'
          echo "$RESPONSE" | jq -e '.success == true and (.result.subdomain | type == "string" and length > 0)' >/dev/null
          SUBDOMAIN="$(echo "$RESPONSE" | jq -r '.result.subdomain')"
          echo "Verified workers.dev account subdomain: $SUBDOMAIN"
          echo "BARQ_WORKERS_DEV_SUBDOMAIN=$SUBDOMAIN" >> "$GITHUB_ENV"
      - name: Apply migrations to isolated Preview D1 only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply barq-phase2-test-2026-11-20 --remote --config wrangler.fallback.test.toml
      - name: Deploy isolated fallback Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.fallback.test.toml 2>&1 | tee deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          test -n "$URL"
          echo "BARQ_FALLBACK_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Install fallback Preview-only secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BARQ_PREVIEW_JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET --config wrangler.fallback.test.toml
          printf '%s' "$BARQ_PREVIEW_TIGRIS_ACCESS_KEY_ID" | npx --yes wrangler@4 secret put TIGRIS_ACCESS_KEY_ID --config wrangler.fallback.test.toml
          printf '%s' "$BARQ_PREVIEW_TIGRIS_SECRET_ACCESS_KEY" | npx --yes wrangler@4 secret put TIGRIS_SECRET_ACCESS_KEY --config wrangler.fallback.test.toml
      - name: Verify fallback liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 15 --silent --show-error --fail "$BARQ_FALLBACK_PREVIEW_URL/health/live" > live.json
          curl --connect-timeout 5 --max-time 15 --silent --show-error --fail "$BARQ_FALLBACK_PREVIEW_URL/health/ready" > ready.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const live = JSON.parse(fs.readFileSync('live.json', 'utf8'));
          const ready = JSON.parse(fs.readFileSync('ready.json', 'utf8'));
          if (live.status !== 'alive' || live.service !== 'barq-api') throw new Error('Fallback liveness verification failed');
          if (ready.status !== 'ready' || ready.service !== 'barq-api') throw new Error('Fallback D1 readiness verification failed');
          console.log('Isolated fallback Worker is live and its shared Preview D1 is ready.');
          NODE
          echo "Fallback Preview Worker URL: $BARQ_FALLBACK_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Run account, privacy, contacts, messaging, reactions, pinning, SPARK, and groups integration
        timeout-minutes: 15
        env:
          BARQ_PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: node test/barq_preview_integration.mjs
      - name: Run real Preview media upload, resume, integrity, range, and authorization integration
        timeout-minutes: 15
        env:
          BARQ_PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BARQ_PREVIEW_MEDIA_CREDENTIALS_CONFIGURED: "true"
        run: node test/barq_preview_media_integration.mjs
      - name: Prepare Flutter and Android build environment
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter SDK
        if: success()
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preinstall Android NDK with retry
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # A transient SDK download previously left a truncated NDK archive.
          # Remove only this version and retry installation before Gradle starts.
          rm -rf "${ANDROID_HOME}/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              test -d "${ANDROID_HOME}/ndk/$NDK_VERSION"
              break
            fi
            rm -rf "${ANDROID_HOME}/ndk/$NDK_VERSION"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to install Android NDK $NDK_VERSION after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Install Android dependencies
        if: success()
        working-directory: android
        run: flutter pub get
      - name: Analyze Android source
        if: success()
        working-directory: android
        run: flutter analyze
      - name: Run Android unit and widget tests
        if: success()
        working-directory: android
        run: flutter test
      - name: Build optimized Preview-connected arm64 APK
        if: success()
        working-directory: android
        run: |
          set -euo pipefail
          BARQ_API_BASE="$BARQ_FALLBACK_PREVIEW_URL"
          BARQ_MEDIA_BASE="$BARQ_FALLBACK_PREVIEW_URL"
          case "$BARQ_API_BASE" in https://*.workers.dev) ;; *) echo "::error::API endpoint is not this run's isolated Preview Worker."; exit 1;; esac
          test "$BARQ_MEDIA_BASE" = "$BARQ_API_BASE"
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=BARQ_API_BASE="$BARQ_API_BASE" \
            --dart-define=BARQ_MEDIA_BASE="$BARQ_MEDIA_BASE"
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Upload Preview-connected BARQ APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: barq-phase8-preview-arm64-apk
          path: android/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct Preview APK download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: barq-preview-${{ github.run_number }}-${{ github.run_attempt }}
          name: BARQ Preview APK ${{ github.run_number }}
          prerelease: true
          files: android/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          fail_on_unmatched_files: true
      - name: Publish isolated Preview integration summary
        if: always()
        run: |
          echo "### BARQ isolated Preview integration" >> "$GITHUB_STEP_SUMMARY"
          echo "The account and media suites above target the URL emitted by this run's isolated fallback Worker deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "No Vercel alias or legacy Worker URL is used by these live integration tests." >> "$GITHUB_STEP_SUMMARY"

# Build request marker: run the isolated Preview verification and ARM64 APK artifact pipeline.
