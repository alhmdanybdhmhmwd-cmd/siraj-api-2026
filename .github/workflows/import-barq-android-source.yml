name: Import BARQ Android source archive

on:
  push:
    branches:
      - barq/phase-2-android-ci-2026-11-20
    paths:
      - BARQ_PHASE_2_ANDROID_GITHUB_READY_UPDATED.zip

permissions:
  contents: write

jobs:
  import-android-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: barq/phase-2-android-ci-2026-11-20

      - name: Validate and extract Android source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          from pathlib import Path

          archive = Path("BARQ_PHASE_2_ANDROID_GITHUB_READY_UPDATED.zip")
          if not archive.is_file():
              raise SystemExit("Expected Android source archive was not uploaded.")

          with ZipFile(archive) as z:
              names = z.namelist()
              if not names:
                  raise SystemExit("Archive is empty.")
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts or not p.parts or p.parts[0] != "android":
                      raise SystemExit(f"Unsafe or unexpected archive path: {name}")
              if "android/pubspec.yaml" not in names:
                  raise SystemExit("Archive does not contain android/pubspec.yaml")
              z.extractall(".")

          if not Path("android/lib/main.dart").is_file():
              raise SystemExit("Android source extraction is incomplete.")
          PY

      - name: Commit extracted source and remove uploaded archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git rm BARQ_PHASE_2_ANDROID_GITHUB_READY_UPDATED.zip
          git commit -m "Add BARQ Android source for Flutter validation"
          git push origin HEAD:barq/phase-2-android-ci-2026-11-20
