name: BARQ Cloud UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["barq/**"]
    paths:
      - "android/lib/main.dart"
      - "android/pubspec.yaml"
      - "android/test/**"
      - "android/integration_test/**"
      - ".github/workflows/barq-cloud-ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: barq-cloud-ui-screenshots-diagnostics
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get
      - name: Capture real BARQ screens on Android emulator
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            cd android
            mkdir -p ../artifacts
            trap 'status=$?; echo "capture_exit_code=$status" > ../artifacts/capture-diagnostics.txt; adb devices -l >> ../artifacts/capture-diagnostics.txt 2>&1 || true; adb -s emulator-5554 shell getprop sys.boot_completed >> ../artifacts/capture-diagnostics.txt 2>&1 || true; exit $status' EXIT
            echo 'DIAG: emulator is ready; listing connected devices'
            adb devices -l
            echo 'DIAG: starting BARQ integration screenshot test'
            flutter test integration_test/barq_screenshots_test.dart -d emulator-5554 --reporter expanded
            cd ..
            count="$(find artifacts/barq-ui-screenshots -type f -iname '*.png' | wc -l)"
            echo "Captured real emulator PNG files: $count"
            test "$count" -ge 8
            zip -qr artifacts/barq-ui-screenshots.zip artifacts/barq-ui-screenshots
            unzip -l artifacts/barq-ui-screenshots.zip
      - name: Upload screenshot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-ui-screenshots-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
