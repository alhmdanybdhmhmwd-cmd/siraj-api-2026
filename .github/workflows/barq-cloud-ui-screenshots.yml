name: BARQ Cloud UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["barq/**"]
    paths:
      - "android/lib/main.dart"
      - "android/pubspec.yaml"
      - "android/test/**"
      - ".github/workflows/barq-cloud-ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: barq-cloud-ui-screenshots-api30
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get
      - name: Capture BARQ UI in isolated headless tests
        working-directory: android
        run: |
          set -uo pipefail
          rm -rf ../artifacts/barq-ui-screenshots
          tests=(
            "01 capture login"
            "02 capture password recovery"
            "03 capture home chats"
            "04 capture home SPARK"
            "05 capture contacts"
            "06 capture account"
            "07 capture private chat"
            "08 capture group chat"
            "09 capture public profile"
            "10 capture nearby devices"
            "11 capture SPARK viewer"
          )
          failures=0
          for test_name in "${tests[@]}"; do
            echo "::group::BARQ capture: $test_name"
            if timeout 65s flutter test --reporter expanded --plain-name "$test_name" test/barq_screenshots_test.dart; then
              echo "CAPTURE_TEST_OK: $test_name"
            else
              code=$?
              echo "CAPTURE_TEST_FAILED: $test_name (exit $code)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "CAPTURE_TEST_FAILURES=$failures"
          exit 0
      - name: Package screenshots
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d artifacts/barq-ui-screenshots ]; then
            count="$(find artifacts/barq-ui-screenshots -type f -iname '*.png' | wc -l)"
            echo "Captured PNG files: $count"
            if [ "$count" -lt 8 ]; then
              echo "Insufficient real screenshots: expected at least 8, found $count." > artifacts/SCREENSHOT_CAPTURE_FAILED.txt
              exit 1
            fi
            cd artifacts
            zip -qr barq-ui-screenshots.zip barq-ui-screenshots
            unzip -l barq-ui-screenshots.zip
          else
            echo "Screenshot test did not produce an output directory." > artifacts/SCREENSHOT_CAPTURE_FAILED.txt
            exit 1
          fi
      - name: Upload screenshot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-ui-screenshots-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
