name: BARQ Cloud UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["barq/**"]
    paths:
      - "android/lib/main.dart"
      - "android/pubspec.yaml"
      - "android/integration_test/**"
      - "android/test_driver/**"
      - ".github/workflows/barq-cloud-ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: barq-cloud-ui-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get
      - name: Run screenshots on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/barq_screenshots_test.dart
      - name: Package screenshots
        if: always()
        run: |
          if [ -d artifacts/barq-ui-screenshots ]; then
            cd artifacts
            zip -qr barq-ui-screenshots.zip barq-ui-screenshots
          else
            mkdir -p artifacts
            echo "Screenshot driver did not produce an output directory." > artifacts/SCREENSHOT_CAPTURE_FAILED.txt
          fi
      - name: Upload screenshot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-ui-screenshots-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
