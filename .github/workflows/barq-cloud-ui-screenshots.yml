name: BARQ Cloud UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["barq/**"]
    paths:
      - "android/lib/main.dart"
      - "android/pubspec.yaml"
      - "android/test/**"
      - ".github/workflows/barq-cloud-ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: barq-cloud-ui-screenshots-api30
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get
      - name: Capture BARQ UI in headless Flutter test
        working-directory: android
        run: |
          set -euxo pipefail
          flutter test --reporter expanded test/barq_screenshots_test.dart
      - name: Package screenshots
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d artifacts/barq-ui-screenshots ]; then
            count="$(find artifacts/barq-ui-screenshots -type f -iname '*.png' | wc -l)"
            echo "Captured PNG files: $count"
            if [ "$count" -lt 8 ]; then
              echo "Insufficient real screenshots: expected at least 8, found $count." > artifacts/SCREENSHOT_CAPTURE_FAILED.txt
              exit 1
            fi
            cd artifacts
            zip -qr barq-ui-screenshots.zip barq-ui-screenshots
            unzip -l barq-ui-screenshots.zip
          else
            echo "Screenshot test did not produce an output directory." > artifacts/SCREENSHOT_CAPTURE_FAILED.txt
            exit 1
          fi
      - name: Upload screenshot bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-ui-screenshots-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
