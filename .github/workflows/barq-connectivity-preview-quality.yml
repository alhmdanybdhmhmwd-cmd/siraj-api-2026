name: BARQ connectivity proxy quality

on:
  push:
    branches: ["barq/phase-2-android-ci-2026-11-20"]
    paths:
      - "api/[...path].js"
      - "test/vercel_proxy_preview.test.mjs"
      - ".github/workflows/barq-connectivity-preview-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "api/[...path].js"
      - "test/vercel_proxy_preview.test.mjs"
      - ".github/workflows/barq-connectivity-preview-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-proxy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated Preview proxy contract
        run: node --test test/vercel_proxy_preview.test.mjs
