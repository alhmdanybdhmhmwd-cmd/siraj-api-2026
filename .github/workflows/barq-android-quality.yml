name: BARQ Android quality gate

on:
  workflow_dispatch:
  push:
    branches: ["barq/phase-2-android-ci-2026-11-20", "barq/fix-approved-menus-2026-11-22"]
    paths:
      - "android/**"
      - "android/test/**"
      - "BARQ_PHASE_2_ANDROID_GITHUB_READY.zip"
      - ".github/workflows/barq-android-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - "android/test/**"
      - "BARQ_PHASE_2_ANDROID_GITHUB_READY.zip"
      - ".github/workflows/barq-android-quality.yml"

permissions:
  contents: write

# Serialize lockfile resolution/pushes; only the newest branch run should proceed.
concurrency:
  group: barq-android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android source
        shell: bash
        run: |
          if [ -f BARQ_PHASE_2_ANDROID_GITHUB_READY.zip ] && [ ! -f android/pubspec.yaml ]; then
            unzip -q BARQ_PHASE_2_ANDROID_GITHUB_READY.zip
          fi
          if [ ! -f android/pubspec.yaml ]; then
            echo "::error::Expected android/pubspec.yaml or BARQ_PHASE_2_ANDROID_GITHUB_READY.zip at repository root."
            exit 1
          fi
          test -f android/pubspec.lock
          test -f android/lib/main.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Commit resolved Flutter dependency lockfile
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(barq): lock media playback dependencies"
            git push
          fi
      - name: Analyze Dart source
        working-directory: android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: android
        run: flutter test
      - name: Build arm64 debug APK for diagnostics
        if: github.event_name != 'pull_request'
        working-directory: android
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload arm64 debug diagnostics
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: barq-android-debug-diagnostics-arm64
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Build optimized arm64 release APK for device testing
        if: github.event_name != 'pull_request'
        working-directory: android
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Upload optimized arm64 test APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: barq-android-test-apk-arm64
          path: android/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

# Pushes to the BARQ development branch also produce internal QA APK artifacts.
# Pull requests run analysis and tests only; no APK is published from PR code.
