name: BARQ Android quality gate

on:
  workflow_dispatch:
  push:
    branches: ["barq/phase-2-android-ci-2026-11-20"]
    paths:
      - "android/**"
      - "BARQ_PHASE_2_ANDROID_GITHUB_READY.zip"
      - ".github/workflows/barq-android-quality.yml"

permissions:
  contents: read

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android source
        shell: bash
        run: |
          if [ -f BARQ_PHASE_2_ANDROID_GITHUB_READY.zip ] && [ ! -f android/pubspec.yaml ]; then
            unzip -q BARQ_PHASE_2_ANDROID_GITHUB_READY.zip
          fi
          if [ ! -f android/pubspec.yaml ]; then
            echo "::error::Expected android/pubspec.yaml or BARQ_PHASE_2_ANDROID_GITHUB_READY.zip at repository root."
            exit 1
          fi
          test -f android/pubspec.lock
          test -f android/lib/main.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: android
        run: flutter test
      - name: Build arm64 debug APK for validation only
        working-directory: android
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload arm64 validation APK
        uses: actions/upload-artifact@v4
        with:
          name: barq-android-validation-apk-arm64
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Trigger quality validation after the Android source archive was extracted.
