name: BARQ Android quality gate

on:
  workflow_dispatch:
    inputs:
      build_beta_apk:
        description: "Build an internal beta APK only after Preview endpoints are configured"
        required: false
        default: false
        type: boolean
  push:
    branches: ["barq/**"]
    paths:
      - "android/**"
      - "BARQ_PHASE_2_ANDROID_GITHUB_READY.zip"
      - ".github/workflows/barq-android-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - "BARQ_PHASE_2_ANDROID_GITHUB_READY.zip"
      - ".github/workflows/barq-android-quality.yml"

permissions:
  contents: write

concurrency:
  group: barq-android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android source
        shell: bash
        run: |
          if [ -f BARQ_PHASE_2_ANDROID_GITHUB_READY.zip ] && [ ! -f android/pubspec.yaml ]; then
            unzip -q BARQ_PHASE_2_ANDROID_GITHUB_READY.zip
          fi
          if [ ! -f android/pubspec.yaml ]; then
            echo "::error::Expected android/pubspec.yaml or BARQ_PHASE_2_ANDROID_GITHUB_READY.zip at repository root."
            exit 1
          fi
          test -f android/pubspec.lock
          test -f android/lib/main.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Commit resolved Flutter dependency lockfile
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(barq): lock resolved Flutter dependencies"
            git push
          fi
      - name: Analyze Dart source
        working-directory: android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: android
        run: flutter test
      - name: Validate beta endpoints
        if: github.event_name == 'workflow_dispatch' && inputs.build_beta_apk
        env:
          BARQ_API_BASE: ${{ vars.BARQ_API_BASE }}
          BARQ_MEDIA_BASE: ${{ vars.BARQ_MEDIA_BASE }}
        run: |
          test -n "$BARQ_API_BASE" || { echo "::error::Configure the BARQ_API_BASE repository variable to the isolated Preview API URL."; exit 1; }
          test -n "$BARQ_MEDIA_BASE" || { echo "::error::Configure the BARQ_MEDIA_BASE repository variable to the isolated Preview media URL."; exit 1; }
          case "$BARQ_API_BASE" in https://*) ;; *) echo "::error::BARQ_API_BASE must use HTTPS."; exit 1;; esac
          case "$BARQ_MEDIA_BASE" in https://*) ;; *) echo "::error::BARQ_MEDIA_BASE must use HTTPS."; exit 1;; esac
      - name: Build optimized arm64 beta APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_beta_apk
        working-directory: android
        env:
          BARQ_API_BASE: ${{ vars.BARQ_API_BASE }}
          BARQ_MEDIA_BASE: ${{ vars.BARQ_MEDIA_BASE }}
        run: >-
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          --dart-define=BARQ_API_BASE="$BARQ_API_BASE"
          --dart-define=BARQ_MEDIA_BASE="$BARQ_MEDIA_BASE"
      - name: Upload internal beta APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_beta_apk
        uses: actions/upload-artifact@v4
        with:
          name: barq-internal-beta-arm64
          path: android/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

# Pushes and pull requests run analysis/tests only. Beta APKs require an explicit
# workflow_dispatch input and HTTPS Preview endpoints; no production endpoint is hard-coded.
