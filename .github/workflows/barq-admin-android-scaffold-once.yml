name: BARQ Admin Android platform scaffold

on:
  push:
    branches:
      - "barq-admin-foundation-2026-11-23"
    paths:
      - ".github/workflows/barq-admin-android-scaffold-once.yml"

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq-admin-foundation-2026-11-23
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.barq --project-name admin /tmp/barq_admin_scaffold
          mkdir -p admin/mobile
          cp -R /tmp/barq_admin_scaffold/android admin/mobile/android
      - name: Configure AppAuth redirect and resolve lockfile
        working-directory: admin/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Flutter Android Kotlin Gradle template was not generated")
          source = gradle.read_text()
          source = source.replace("com.example.admin", "com.barq.admin")
          declaration = '''
          val barqGoogleOidcClientId = System.getenv("BARQ_GOOGLE_OIDC_CLIENT_ID").orEmpty()
          val barqGoogleOidcRedirectScheme =
              if (barqGoogleOidcClientId.endsWith(".apps.googleusercontent.com")) {
                  "com.googleusercontent.apps." + barqGoogleOidcClientId.substringBefore(".")
              } else {
                  "com.barq.admin.auth"
              }

          '''
          if "val barqGoogleOidcClientId" not in source:
              source = source.replace("android {", declaration + "android {", 1)
          if 'manifestPlaceholders["appAuthRedirectScheme"]' not in source:
              source = source.replace(
                  "        versionName = flutter.versionName",
                  '        versionName = flutter.versionName\n        manifestPlaceholders["appAuthRedirectScheme"] = barqGoogleOidcRedirectScheme',
                  1,
              )
          gradle.write_text(source)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if 'android.permission.INTERNET' not in xml:
              xml = xml.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          xml = xml.replace('android:label="admin"', 'android:label="BARQ Admin"')
          manifest.write_text(xml)
          PY
          flutter pub get
      - name: Commit Android platform and dependency lock
        run: |
          git add admin/mobile/android admin/mobile/pubspec.lock
          git commit -m "Add BARQ Admin Android platform and lock Flutter dependencies"
          git pull --rebase origin barq-admin-foundation-2026-11-23
          git push origin HEAD:barq-admin-foundation-2026-11-23
