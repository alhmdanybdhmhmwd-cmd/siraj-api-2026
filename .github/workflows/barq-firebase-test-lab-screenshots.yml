name: BARQ Firebase Test Lab Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barq-firebase-test-lab-screenshots
  cancel-in-progress: false

jobs:
  firebase-test-lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: barq-60b76
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq/repair-batch-2026-11-23

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter app and instrumentation test APKs
        working-directory: android
        run: |
          set -euxo pipefail
          flutter pub get
          flutter build apk --debug
          cd android
          ./gradlew app:assembleAndroidTest
          ./gradlew app:assembleDebug -Ptarget=integration_test/barq_screenshots_test.dart
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BARQ_FIREBASE_TESTLAB_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Test Lab access
        run: |
          set -euxo pipefail
          gcloud config set project "$FIREBASE_PROJECT_ID"
          gcloud services list --enabled --project "$FIREBASE_PROJECT_ID" --filter="config.name:testing.googleapis.com"
          gcloud firebase test android models list --project "$FIREBASE_PROJECT_ID" --format="table(id,name,form)"

      - name: Run BARQ screens on a cloud Android device
        working-directory: android/android
        timeout-minutes: 35
        run: |
          set -euxo pipefail
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=Pixel2.arm,version=30,locale=ar,orientation=portrait \
            --timeout 15m \
            --results-dir="barq-screenshots-${GITHUB_RUN_ID}" \
            --project "$FIREBASE_PROJECT_ID"

      - name: Upload built APKs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barq-firebase-testlab-build-${{ github.run_number }}
          path: |
            android/android/app/build/outputs/apk/debug/app-debug.apk
            android/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
