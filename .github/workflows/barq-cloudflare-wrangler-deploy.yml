name: BARQ Cloudflare Wrangler deploy (guarded preview and production)

on:
  pull_request:
    branches: ["main", "barq-admin-foundation-2026-11-23"]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "wrangler.test.toml"
      - "package.json"
      - "migrations/**"
      - ".github/workflows/barq-cloudflare-wrangler-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: "Deploy only the isolated BARQ Preview Worker and D1"
        required: true
        type: boolean
        default: false
      deploy_production:
        description: "Explicitly approve deploying the production BARQ Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: barq-cloudflare-wrangler-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && inputs.deploy_preview == false && 'production' || 'preview-or-validation' }}
  cancel-in-progress: false

jobs:
  validate-production-bundle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Guard production target and dry-run bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg = tomllib.loads(Path("wrangler.toml").read_text())
          assert cfg["name"] == "siraj-api"
          assert cfg["main"] == "src/src/index.js"
          assert cfg["d1_databases"][0]["database_name"] == "siraj-db"
          assert cfg["d1_databases"][0]["database_id"] == "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0"
          assert cfg["d1_databases"][0]["migrations_dir"] == "migrations/production"
          assert cfg["vars"]["TIGRIS_BUCKET"] == "siraj-media"
          assert cfg["ai"]["binding"] == "AI"
          assert cfg["triggers"]["crons"] == ["*/15 * * * *"]
          print("Production config identity verified. No database migrations or deployment are performed by this job.")
          PY
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

  validate-preview-bundle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Guard isolated Preview target and dry-run bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg = tomllib.loads(Path("wrangler.test.toml").read_text())
          db = cfg["d1_databases"][0]
          assert cfg["name"] == "barq-api-phase2-test"
          assert cfg["workers_dev"] is True
          assert db["database_name"] == "barq-phase2-test-2026-11-20"
          assert db["database_id"] == "5bfada32-4f9b-4edb-85dd-3b3b30ab73b0"
          assert db["database_id"] != "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0"
          assert db["migrations_dir"] == "migrations"
          assert cfg["vars"]["TIGRIS_BUCKET"] == "barq-preview-media"
          assert cfg["vars"]["TIGRIS_BUCKET"] != "siraj-media"
          assert cfg["ai"]["binding"] == "AI"
          print("Isolated Preview identity verified. No D1 migrations or deployment are performed by this job.")
          PY
          npx --yes wrangler@4 deploy --dry-run --config wrangler.test.toml

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_preview == true && inputs.deploy_production == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
      BARQ_PREVIEW_HEALTH_URL: ${{ vars.BARQ_PREVIEW_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Preview-only approval, credentials, and isolated target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.deploy_preview }}" = "true"
          test "${{ inputs.deploy_production }}" = "false"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BARQ_PREVIEW_HEALTH_URL"
          case "$BARQ_PREVIEW_HEALTH_URL" in https://*) ;; *) echo "Preview health URL must use HTTPS"; exit 1;; esac
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg = tomllib.loads(Path("wrangler.test.toml").read_text())
          db = cfg["d1_databases"][0]
          assert cfg["name"] == "barq-api-phase2-test"
          assert db["database_id"] == "5bfada32-4f9b-4edb-85dd-3b3b30ab73b0"
          assert db["database_id"] != "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0"
          assert db["migrations_dir"] == "migrations"
          assert cfg["vars"]["TIGRIS_BUCKET"] == "barq-preview-media"
          print("Preview target guard passed. No migrations are run.")
          PY
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Authenticate Wrangler
        run: npx --yes wrangler@4 whoami
      - name: Deploy isolated Preview Worker through GitHub Actions
        run: npx --yes wrangler@4 deploy --config wrangler.test.toml
      - name: Verify Preview Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 --silent --show-error --fail "${BARQ_PREVIEW_HEALTH_URL%/}/health/live"

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && inputs.deploy_preview == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
      BARQ_PRODUCTION_HEALTH_URL: ${{ vars.BARQ_PRODUCTION_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify explicit approval, credentials, and exact production target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.deploy_production }}" = "true"
          test "${{ inputs.deploy_preview }}" = "false"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BARQ_PRODUCTION_HEALTH_URL"
          case "$BARQ_PRODUCTION_HEALTH_URL" in https://*) ;; *) echo "Production health URL must use HTTPS"; exit 1;; esac
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cfg = tomllib.loads(Path("wrangler.toml").read_text())
          assert cfg["name"] == "siraj-api"
          assert cfg["d1_databases"][0]["database_id"] == "0db93afd-4bf5-4423-9e25-7a2f4f4bdbe0"
          assert cfg["vars"]["TIGRIS_BUCKET"] == "siraj-media"
          assert cfg["d1_databases"][0]["migrations_dir"] == "migrations/production"
          print("Production target guard passed. Existing production D1 schema will not be migrated.")
          PY
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Authenticate Wrangler
        run: npx --yes wrangler@4 whoami
      - name: Deploy Worker through GitHub Actions (bypasses Cloudflare Builds)
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 --silent --show-error --fail "${BARQ_PRODUCTION_HEALTH_URL%/}/health/live"
