name: BARQ Phase 6 Android tests

on:
  push:
    branches: ["barq/media-experience-2026-11-22"]
    paths:
      - "android/**"
      - ".github/workflows/barq-phase6-android-tests.yml"

permissions:
  contents: read

concurrency:
  group: barq-phase6-android-tests
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: android
        run: flutter test
