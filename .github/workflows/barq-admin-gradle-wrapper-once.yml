name: BARQ Admin Gradle wrapper completion

on:
  push:
    branches:
      - "barq-admin-foundation-2026-11-23"
    paths:
      - ".github/workflows/barq-admin-gradle-wrapper-once.yml"

permissions:
  contents: write

jobs:
  add-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq-admin-foundation-2026-11-23
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Regenerate Gradle wrapper files omitted by repository ignore rules
        run: |
          flutter create --platforms=android --org com.barq --project-name admin /tmp/barq_admin_wrapper
          cp /tmp/barq_admin_wrapper/android/gradlew admin/mobile/android/gradlew
          cp /tmp/barq_admin_wrapper/android/gradlew.bat admin/mobile/android/gradlew.bat
          cp /tmp/barq_admin_wrapper/android/gradle/wrapper/gradle-wrapper.jar admin/mobile/android/gradle/wrapper/gradle-wrapper.jar
      - name: Track Gradle wrapper files ignored by repository defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f admin/mobile/android/gradlew admin/mobile/android/gradlew.bat admin/mobile/android/gradle/wrapper/gradle-wrapper.jar
          git commit -m "Track BARQ Admin Android Gradle wrapper"
          git pull --rebase origin barq-admin-foundation-2026-11-23
          git push origin HEAD:barq-admin-foundation-2026-11-23
