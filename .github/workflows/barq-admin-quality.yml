name: BARQ Admin Quality

on:
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/barq-admin-quality.yml"
  push:
    branches:
      - "barq-admin-foundation-2026-11-23"
    paths:
      - "admin/**"
      - ".github/workflows/barq-admin-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq-admin-foundation-2026-11-23
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        working-directory: admin
        run: npm run check
      - name: Run Admin unit tests
        working-directory: admin
        run: npm test
      - name: Validate isolated Admin schema and audit immutability
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("admin/migrations/0001_admin_workspace.sql").read_text())
          db.executescript(Path("admin/migrations/0002_project_knowledge.sql").read_text())
          db.executescript(Path("admin/migrations/0003_vision_usage_limits.sql").read_text())
          db.executescript(Path("admin/migrations/0004_image_generation_limits.sql").read_text())
          db.executescript(Path("admin/migrations/0005_owner_identity_sessions.sql").read_text())
          names = {row[0] for row in db.execute(
              "SELECT name FROM sqlite_master WHERE type IN ('table','trigger')"
          )}
          required = {
              "admin_workspaces", "admin_tasks", "admin_task_checkpoints",
              "admin_approvals", "admin_audit_events", "admin_project_knowledge",
              "admin_ai_usage_limits", "admin_image_generation_limits",
              "admin_audit_no_update", "admin_audit_no_delete", "admin_owner_devices",
              "admin_owner_sessions", "admin_oidc_nonce_uses", "admin_auth_rate_limits",
              "admin_owner_refresh_token_history"
          }
          missing = required - names
          assert not missing, f"Missing schema objects: {sorted(missing)}"
          db.execute("INSERT INTO admin_workspaces(id, owner_subject) VALUES ('owner:test', 'test')")
          db.execute("""INSERT INTO admin_audit_events
              (id, workspace_id, actor_subject, event_type, target_type, target_id)
              VALUES ('evt', 'owner:test', 'test', 'test', 'test', 'test')""")
          for statement in (
              "UPDATE admin_audit_events SET event_type='tampered' WHERE id='evt'",
              "DELETE FROM admin_audit_events WHERE id='evt'"
          ):
              try:
                  db.execute(statement)
                  raise AssertionError("Audit event mutation unexpectedly succeeded")
              except sqlite3.IntegrityError:
                  pass
          for _ in range(3):
              row = db.execute("""
                  INSERT INTO admin_ai_usage_limits (workspace_id, window_start, request_count)
                  VALUES ('owner:test', 1, 1)
                  ON CONFLICT(workspace_id, window_start) DO UPDATE SET
                    request_count = request_count + 1
                  WHERE request_count < 3
                  RETURNING request_count
              """).fetchone()
              assert row is not None
          blocked = db.execute("""
              INSERT INTO admin_ai_usage_limits (workspace_id, window_start, request_count)
              VALUES ('owner:test', 1, 1)
              ON CONFLICT(workspace_id, window_start) DO UPDATE SET
                request_count = request_count + 1
              WHERE request_count < 3
              RETURNING request_count
          """).fetchone()
          assert blocked is None, "Vision rate limit allowed a fourth request"
          for _ in range(2):
              row = db.execute("""
                  INSERT INTO admin_image_generation_limits (workspace_id, window_start, request_count)
                  VALUES ('owner:test', 2, 1)
                  ON CONFLICT(workspace_id, window_start) DO UPDATE SET
                    request_count = request_count + 1
                  WHERE request_count < 2
                  RETURNING request_count
              """).fetchone()
              assert row is not None
          blocked_image = db.execute("""
              INSERT INTO admin_image_generation_limits (workspace_id, window_start, request_count)
              VALUES ('owner:test', 2, 1)
              ON CONFLICT(workspace_id, window_start) DO UPDATE SET
                request_count = request_count + 1
              WHERE request_count < 2
              RETURNING request_count
          """).fetchone()
          assert blocked_image is None, "Image generation rate limit allowed a third request"
          db.execute("""
              INSERT INTO admin_owner_devices (id, owner_subject, device_name, platform)
              VALUES ('device:test', 'test', 'CI device', 'android')
          """)
          db.execute("""
              INSERT INTO admin_owner_sessions
                (id, owner_subject, device_id, refresh_token_hash, refresh_expires_at)
              VALUES ('session:test', 'test', 'device:test', 'hash-v1', datetime('now', '+30 days'))
          """)
          db.execute("""
              INSERT INTO admin_owner_refresh_token_history (token_hash, session_id)
              VALUES ('hash-v1', 'session:test')
          """)
          db.execute("""
              UPDATE admin_owner_sessions SET refresh_token_hash='hash-v2'
              WHERE id='session:test' AND refresh_token_hash='hash-v1'
          """)
          db.execute("""
              INSERT INTO admin_owner_refresh_token_history (token_hash, session_id)
              VALUES ('hash-v2', 'session:test')
          """)
          history_count = db.execute("""
              SELECT COUNT(*) FROM admin_owner_refresh_token_history
              WHERE session_id='session:test'
          """).fetchone()[0]
          assert history_count == 2, "Refresh-token history did not retain used hashes"
          nonce = "a" * 64
          db.execute("""
              INSERT INTO admin_oidc_nonce_uses (nonce_hash, owner_subject, expires_at)
              VALUES (?, 'test', datetime('now', '+10 minutes'))
          """, (nonce,))
          try:
              db.execute("""
                  INSERT INTO admin_oidc_nonce_uses (nonce_hash, owner_subject, expires_at)
                  VALUES (?, 'test', datetime('now', '+10 minutes'))
              """, (nonce,))
              raise AssertionError("OIDC nonce replay unexpectedly succeeded")
          except sqlite3.IntegrityError:
              pass
          for _ in range(5):
              row = db.execute("""
                  INSERT INTO admin_auth_rate_limits (bucket_key, window_start, request_count)
                  VALUES ('oidc-test', 100, 1)
                  ON CONFLICT(bucket_key, window_start) DO UPDATE SET
                    request_count = request_count + 1
                  WHERE request_count < 5
                  RETURNING request_count
              """).fetchone()
              assert row is not None
          blocked_auth = db.execute("""
              INSERT INTO admin_auth_rate_limits (bucket_key, window_start, request_count)
              VALUES ('oidc-test', 100, 1)
              ON CONFLICT(bucket_key, window_start) DO UPDATE SET
                request_count = request_count + 1
              WHERE request_count < 5
              RETURNING request_count
          """).fetchone()
          assert blocked_auth is None, "Auth rate limit allowed a sixth request"
          print("Admin schema, immutable audit, image limits, OIDC nonce, refresh history and auth throttling checks passed.")
          PY

  admin-mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: barq-admin-foundation-2026-11-23
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Validate Android AppAuth platform wiring without building an APK
        run: |
          test -f android/gradlew
          grep -q 'applicationId = "com.barq.admin"' android/app/build.gradle.kts
          grep -q 'manifestPlaceholders["appAuthRedirectScheme"]' android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          cd android
          ./gradlew :app:processDebugManifest
      - name: Enforce Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Admin mobile app
        run: flutter analyze
      - name: Run Admin mobile tests
        run: flutter test
