name: BARQ Six Features CI

on:
  pull_request:
    branches:
      - barq/development-2026-11-19
  push:
    branches:
      - barq/six-features-2026-11-19

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: node --check src/src/index.js
      - name: Run Worker tests
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run D1 migration tests
        run: python test/migrations.test.py
