name: BARQ local runtime health probes

on:
  workflow_dispatch:
  push:
    branches:
      - barq/phase-2-d1-isolated-2026-11-20
      - barq/phase-2-android-ci-2026-11-20
    paths:
      - .github/workflows/barq-local-health-probes.yml
      - wrangler.test.toml
      - src/src/index.js

permissions:
  contents: read

jobs:
  local-runtime-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start Worker locally with isolated D1 state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barq-local-d1"
          npm install --no-audit --no-fund
          npx --yes wrangler@4 dev --config wrangler.test.toml --local --ip 127.0.0.1 --port 8787 --var JWT_SECRET:barq-local-runtime-test-only-secret --persist-to "$RUNNER_TEMP/barq-local-d1" > "$RUNNER_TEMP/barq-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/barq-worker.pid"
          sleep 2
          if ! kill -0 "$(cat "$RUNNER_TEMP/barq-worker.pid")" 2>/dev/null; then cat "$RUNNER_TEMP/barq-worker.log"; exit 1; fi
      - name: Verify liveness and readiness HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { kill "$(cat "$RUNNER_TEMP/barq-worker.pid")" 2>/dev/null || true; }
          show_log() { cat "$RUNNER_TEMP/barq-worker.log"; }
          trap show_log ERR
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --connect-timeout 2 --max-time 5 --silent --fail http://127.0.0.1:8787/health/live > "$RUNNER_TEMP/live.json"; then break; fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const live = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/live.json', 'utf8'));
          if (live.status !== 'alive' || live.service !== 'barq-api') throw new Error('Live endpoint response mismatch');
          NODE
          curl --connect-timeout 2 --max-time 8 --silent --show-error --fail http://127.0.0.1:8787/health/ready > "$RUNNER_TEMP/ready.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ready = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ready.json', 'utf8'));
          if (ready.status !== 'ready' || ready.service !== 'barq-api') throw new Error('Ready endpoint response mismatch');
          console.log('HTTP liveness and readiness probes passed against local Worker + isolated local D1.');
          NODE
