name: BARQ test D1 migrations

on:
  workflow_dispatch:
  push:
    branches:
      - barq/phase-2-d1-isolated-2026-11-20
      - barq/phase-2-android-ci-2026-11-20
    paths:
      - .github/workflows/barq-test-db-migrations.yml
      - wrangler.test.toml
      - migrations/**

permissions:
  contents: read

jobs:
  migrate-isolated-test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated configuration
        run: python3 test/barq_wrangler_config.test.py
      - name: Apply migrations only to isolated test D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 migrations apply barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml

      - name: Verify remote isolated revocation schema without reading user data
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT token_hash, user_id, expires_at, revoked_at FROM revoked_sessions LIMIT 0;"

      - name: Inspect isolated users schema and phone uniqueness (read-only)
        shell: bash
        run: |
          set -euo pipefail
          echo "Core users table definition:"
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'users';"
          echo "Core application tables present (users, friendships, messages):"
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT name, sql FROM sqlite_master WHERE type = 'table' AND name IN ('users', 'friendships', 'messages') ORDER BY name;"
          echo "All non-system tables in isolated test D1:"
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
          echo "Users columns:"
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT cid, name, type, \"notnull\", pk FROM pragma_table_info('users') ORDER BY cid;"
          echo "Users indexes and indexed columns:"
          npx --yes wrangler@4 d1 execute barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml --command "SELECT il.name AS index_name, il.\"unique\" AS is_unique, ii.seqno, ii.name AS column_name FROM pragma_index_list('users') AS il JOIN pragma_index_info(il.name) AS ii ORDER BY il.name, ii.seqno;"

