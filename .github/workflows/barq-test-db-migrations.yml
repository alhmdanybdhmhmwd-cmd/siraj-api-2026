name: BARQ test D1 migrations

on:
  workflow_dispatch:
  push:
    branches:
      - barq/phase-2-d1-isolated-2026-11-20
      - barq/phase-2-android-ci-2026-11-20
    paths:
      - .github/workflows/barq-test-db-migrations.yml
      - wrangler.test.toml
      - migrations/**

permissions:
  contents: read

jobs:
  migrate-isolated-test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BARQ_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.BARQ_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated configuration
        run: python3 test/barq_wrangler_config.test.py
      - name: Apply migrations only to isolated test D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 migrations apply barq-phase2-test-2026-11-20 --remote --config wrangler.test.toml
